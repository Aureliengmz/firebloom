<!DOCTYPE html>
<!--
  Firebloom: a real-time volumetric fireball in a single HTML file (WebGL 2 + Web Audio, no dependencies).
  Ray-marched procedural flame, sparks and embers, optional wet ground with reflections, synthesised sound.
  MIT licensed, see LICENSE.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firebloom — real-time fireball</title>
<style>
:root{
  --ink:#000; --text:#c9b8a6; --dim:#7a6b5e; --ember:#ff8a2a; --line:rgba(201,184,166,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:#000;overflow:hidden;color:var(--text);
  font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transform:translateX(-50%);
  font-size:15px;letter-spacing:.02em;color:var(--dim);transition:opacity 1.2s;pointer-events:none;text-align:center;white-space:nowrap}
.hint.gone{opacity:0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;align-items:center;gap:14px;font-size:15px;transition:opacity .6s}
.bar.idle{opacity:.12}
.bar:hover,.bar:focus-within{opacity:1}
button,select{font:inherit;color:var(--text);background:none;border:1px solid var(--line);border-radius:3px;
  padding:5px 11px;cursor:pointer;white-space:nowrap}
button:hover,select:hover{border-color:var(--text)}
button[aria-pressed="true"]{color:#000;background:var(--text);border-color:var(--text)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
select option{background:#111;color:var(--text)}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
#play{width:40px;padding:5px 0;text-align:center}
.track{flex:1;display:flex;align-items:center;gap:12px;min-width:120px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--ember) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:2px;background:linear-gradient(to right,var(--ember) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text)}
#tc{font-variant-numeric:tabular-nums;color:var(--dim);min-width:44px;text-align:right}
.status{position:fixed;left:20px;top:calc(env(safe-area-inset-top,0px) + 20px);font-size:14px;color:var(--dim);
  font-variant-numeric:tabular-nums;pointer-events:none;text-align:left}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:18px;line-height:1.4}
.clean .bar,.clean .hint,.clean .status{display:none}
#credit { position:fixed; right:calc(14px + env(safe-area-inset-right,0px)); top:calc(14px + env(safe-area-inset-top,0px)); z-index:5;
    display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(30,18,10,.32);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font:500 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; letter-spacing:.01em; }
#credit a { display:flex; align-items:center; gap:7px; padding:4px 10px 4px 4px; border-radius:999px; color:rgba(255,255,255,.62);
    text-decoration:none; transition:color .2s ease, background .2s ease; }
#credit a:hover, #credit a:focus-visible { color:#fff; background:rgba(255,255,255,.08); outline:none; }
#credit img { width:22px; height:22px; border-radius:50%; object-fit:cover; }
#credit .wm { height:15px; width:auto; margin:0 2px 0 6px; display:block; }
#credit i { width:1px; height:14px; background:rgba(255,255,255,.18); }
.clean #credit{display:none}
@media (max-width:640px){ .status{top:calc(env(safe-area-inset-top,0px) + 58px)} .opt{display:none} .bar{gap:10px;padding-left:14px;padding-right:14px} .hint{font-size:13px;white-space:normal;width:86%} }
@media (prefers-reduced-motion:reduce){ .hint,.bar{transition:none} }
</style>
</head>

vec4 N(vec3 p){ return texture(uN, p*0.0625)*2.0-1.0; }
vec4 Wo(vec3 p){ return texture(uW, p*0.125); }

float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float erfA(float x){ float x2=x*x; return sign(x)*sqrt(1.0-exp(-x2*(1.2732395+0.147*x2)/(1.0+0.147*x2))); }
// mean value of a gaussian sheet exp(-x^2/2sg^2) over a segment where x goes linearly a -> b
// (exact integration: thin sheets never slip between two ray steps)
float gmean(float a, float b, float sg){
  float d = b - a;
  if(abs(d) < 0.05*sg){ float m = 0.5*(a+b); return exp(-0.5*m*m/(sg*sg)); }
  float k = 0.70710678/sg;
  return (erfA(b*k) - erfA(a*k)) * (1.2533141*sg) / d;
}
// flame front profile: thin bright line + dimmer glow trailing inward (x>0), averaged over [a,b]
float tailMean(float a, float b, float tau){
  float d = b - a; float a2 = max(a,0.0), b2 = max(b,0.0);
  if(abs(d) < 1e-5){ float m=0.5*(a+b); return m>0.0 ? exp(-m/tau) : 0.0; }
  return tau*(exp(-a2/tau) - exp(-b2/tau)) / d;
}
float frontMean(float a, float b, float sg, float tau, float amp){ return gmean(a,b,sg) + amp*tailMean(a,b,tau); }
float frontStack(float a, float b, float sg, float tau, float amp){
  float lo = min(a,b), hi = max(a,b);
  float n0 = floor(lo-0.7+0.5), n1 = floor(hi+0.5);
  float acc = 0.0;
  for(int i=0;i<7;i++){ float n = n0+float(i); if(n>n1) break; acc += frontMean(lo-n, hi-n, sg, tau, amp); }
  return acc;
}

float gDetail = 1.0;
struct Smp { float cush; float cd; float valid; float s; float sd; float L; float eX; float m; float hole; float shW; float ribW; float pocket; float core; float cw; };

Smp field(vec3 q){
  Smp o; o.cush=0.0; o.cd=0.0; o.valid=0.0; o.L=0.0; o.eX=1.0; o.m=0.0; o.hole=0.0; o.shW=0.0; o.ribW=0.0; o.pocket=0.5; o.core=0.0; o.cw=0.0;
  float r = length(q);
  float t = uT;
  vec3 dO = q/max(r,1e-3)*smoothstep(0.0,0.6,r);
  vec4 a = N(q*0.7 + vec3(0.0,-0.16*t,0.0) + uSeed);
  vec3 wq = q + a.xyz*0.2;
  vec4 b = N(wq*1.7 - dO*t*0.32 + vec3(0.0,-0.28*t,0.0) + uSeed.zxy);
  vec3 pb = wq*3.7 - dO*t*0.55 + vec3(0.0,-0.28*t,0.0) + b.yzw*0.2 + uSeed*0.31;
  vec4 w1 = Wo(pb);
  vec4 c = N(wq*3.6 - dO*t*0.55 + b.yzw*0.22 + vec3(0.0,-0.42*t,0.0) + uSeed.yzx);
  vec3 pm = wq*8.6 - dO*t*0.9 + vec3(0.0,-0.45*t,0.0) + c.yzw*0.18 + uSeed.zxy*0.53;
  vec4 w2 = Wo(pm);
  float bumps = (0.6 - w1.x)*0.30 + (0.55 - w2.y)*0.16;
  float env = 1.0 - length(wq*vec3(1.0,0.94,1.0)) + bumps + b.x*0.08;
  float hn = (b.y*0.5+0.5)*0.6 + w1.z*0.4;
  float side = clamp(dot(q, vec3(0.75,0.25,-0.3))*0.5+0.5, 0.0, 1.0);   // dissipation starts on one side
  float s = env - 0.12 - uErode*(0.05 + 0.2*hn + 0.35*side);
  o.s = s; o.sd = s;
  if(s < -0.1 - 0.35*uErode) return o;
  o.valid = 1.0;
  o.hole = smoothstep(uErode*0.85-0.38, uErode*0.85+0.18, hn);
  o.m = smoothstep(-0.04, 0.1, s);
  float fine = 0.0;
  if(gDetail > 0.5){
    vec3 ps = wq*10.5 - dO*t*1.1 + vec3(0.0,-0.7*t,0.0) + c.yzw*0.25 + uSeed*0.19;
    vec4 fn = N(ps*1.55); fine = fn.x*0.03 + fn.y*fn.z*0.018;
  }
  o.sd = s + fine;
  o.L = o.sd*4.8 + t*0.8 + a.w*1.5 + c.x*0.8 + (0.45 - w2.x)*1.3 + b.w*0.6;
  o.shW = smoothstep(0.03, 0.2, s) * (0.55 + 0.45*smoothstep(-0.3,0.4,c.w));
  if(max(uErode,uWisp) > 0.02){
    vec3 pr = wq*6.0 - dO*t*0.8 + vec3(0.0,-0.8*t,0.0) + b.yzw*0.7 + c.yzw*0.35 + uSeed*0.77;
    vec4 e = N(pr);
    o.eX = e.x;
    o.ribW = min(1.0,max(uErode*1.6, uWisp*1.2))*(0.45+0.55*smoothstep(-0.2,0.5,e.w)) * smoothstep(-0.12, 0.35, s + 0.35*uErode + e.w*0.18 + e.y*0.12);
  }
  o.pocket = smoothstep(-0.25, 0.5, b.z*0.6 + c.z*0.4);
  o.core = smoothstep(0.05, 0.8, s);
  o.cw = c.w;
  o.cush = smoothstep(0.0, 0.4, 0.62 - w1.x + c.x*0.08) * 0.7 + smoothstep(0.0, 0.3, 0.55 - w2.y)*0.3;
  o.cd = uCoreDark * (1.0 - smoothstep(0.08, 0.48, length(wq - vec3(0.0,0.18,0.0)) + b.x*0.1 + c.x*0.05));
  return o;
}

// density + heat over the ray segment p0 -> p1
vec3 shade(Smp p0, Smp p1){
  Smp v = p0; if(p1.valid > 0.5) v = p1;   // smooth quantities from the valid end
  float La = p0.valid > 0.5 ? p0.L : p1.L, Lb = p1.valid > 0.5 ? p1.L : p0.L;
  float ea = p0.valid > 0.5 ? p0.eX : p1.eX, eb = p1.valid > 0.5 ? p1.eX : p0.eX;
  const float SS = 0.0045;                 // sheet thickness (in field units): thin and crisp
  float skin = frontMean(p0.sd-0.022, p1.sd-0.022, 0.007, 0.06, 0.28) * 1.3;
  float shells = frontStack(La, Lb, SS*4.8, 0.16, 0.3) * (0.011*4.8/4.4/SS) * v.shW * 0.42 * (1.0 - 0.75*uWisp);
  float ke = 1.0-uErode;
  float sh = skin*1.15*ke*ke + shells*1.2;
  float rib = v.ribW > 0.0 ? frontMean(ea, eb, 0.028, 0.12, 0.25) * 1.5 * v.ribW : 0.0;
  float mh = v.m*v.hole;
  float dens = (1.0 - 0.7*v.cd) * mh*(1.3*(1.0-0.85*uErode) + 1.6*sh) * (1.0 + uSoot*0.8*(1.0-min(sh,1.0))) * (1.0 - 0.3*uErode) + 1.5*rib;
  float heat = uHeat * (mh*((0.24 + 0.22*v.cush + 0.08*v.core)*(1.0-0.6*uErode) + 1.05*sh) + 1.5*rib) / max(mh + rib, 1e-3)
             * mix(0.72, 1.1, v.pocket) * (0.92 + 0.16*v.cw);
  // thin flame sheets glow but stay translucent: they absorb much less than they emit
  float absorb = mh*(0.24*(1.0-0.9*uErode) + 0.45*min(sh,2.5)) * (1.0 + uSoot*0.8) + 0.45*rib + v.cd*mh*2.0;
  return vec3(dens, heat, absorb);
}

vec3 fireCol(float h){
  h = max(h,0.0);
  vec3 c = vec3(1.0,0.095,0.008)*h + vec3(0.0,0.15,0.01)*h*h + vec3(0.0,0.06,0.045)*h*h*h;
  return c*h*h*1.15;
}

vec4 marchFire(vec3 ro, vec3 rd, float tmax, float steps, float j){
  vec3 col = vec3(0.0); float T = 1.0;
  if(uVis <= 0.0) return vec4(col, T);
  float B = uR*(1.7 + 0.5*uErode);
  vec3 oc = ro-uC; float bq=dot(oc,rd), cq=dot(oc,oc)-B*B, h=bq*bq-cq;
  if(h<=0.0) return vec4(col, T);
  float sq=sqrt(h); float t0=max(-bq-sq,0.0), t1=min(-bq+sq,tmax);
  if(t1<=t0) return vec4(col, T);
  float dtw = 2.0*B/steps;
  float t = t0 + dtw*j;
  Smp p0 = field((ro+rd*t-uC)/uR); float tp = t;
  t += dtw;
  for(int i=0;i<500;i++){
    if(t>t1 || T<0.004) break;
    Smp p1 = field((ro+rd*t-uC)/uR);
    if(p0.valid > 0.5 || p1.valid > 0.5){
      vec3 dh = shade(p0, p1);
      if(dh.x > 0.0){
        float seg = uSigma*(t-tp)/uR;
        float a = exp(-dh.z*seg);
        float em = dh.x*seg * (dh.z*seg > 1e-4 ? (1.0-a)/(dh.z*seg) : 1.0);
        col += T*fireCol(dh.y)*em*uEmit*uVis;
        T *= a;
      }
    }
    p0 = p1; tp = t;
    t += p1.valid > 0.5 ? dtw : dtw*(1.0 + clamp(-(p1.s+0.1+0.35*uErode)*6.0, 0.0, 3.0));
  }
  return vec4(col, T);
}

// ---------- ground: scorched earth, gravel, puddles in the hollows ----------
float gLarge(vec2 x){ return N(vec3(x.x*0.45, 3.1, x.y*0.45)).x; }
float gH(vec2 x){
  return gLarge(x)*0.05
       + (0.5 - Wo(vec3(x.x*7.0, 2.0, x.y*7.0)).x)*0.014
       + (0.5 - Wo(vec3(x.x*19.0, 5.0, x.y*19.0)).y)*0.004
       + N(vec3(x.x*38.0, 7.7, x.y*38.0)).x*0.0012;
}
vec3 groundShade(vec3 ro, vec3 rd, float tg, float j){
  vec3 gp = ro + rd*tg;
  vec2 x = gp.xz;
  float dist = tg;
  float e = clamp(dist*0.0015, 0.002, 0.03);                 // wider normal filter far away (no shimmer)
  float h0 = gH(x), hx = gH(x+vec2(e,0.0)), hz = gH(x+vec2(0.0,e));
  vec3 n = normalize(vec3(-(hx-h0)/e, 1.0, -(hz-h0)/e));
  n = normalize(mix(n, vec3(0.0,1.0,0.0), smoothstep(8.0, 30.0, dist)));
  float large = gLarge(x);
  float wetN = N(vec3(x.x*0.21, 11.0, x.y*0.21)).y*0.5+0.5;
  float wet = smoothstep(0.42, 0.52, wetN - large*0.35);
  float damp = 0.6 + 0.4*smoothstep(0.22, 0.42, wetN - large*0.35);    // darkened soil around puddles
  n = normalize(mix(n, vec3(0.0,1.0,0.0), wet));
  vec4 w = Wo(vec3(x.x*7.0, 2.0, x.y*7.0));
  float stone = smoothstep(0.42, 0.2, w.x);
  float tone = N(vec3(x.x*2.3, 13.0, x.y*2.3)).z;
  vec3 soil = vec3(0.075,0.064,0.055)*(0.8 + 0.35*tone);
  vec3 rock = vec3(0.16,0.148,0.136)*(0.55 + 0.9*w.w);
  vec3 alb = mix(soil, rock, stone);
  float cen = length(x - uC.xz);
  alb *= mix(0.35, 1.0, smoothstep(0.6*uR, 2.4*uR, cen));  // scorched under the blast
  alb *= mix(1.0, 0.7, damp);
  alb *= mix(1.0, 0.45, wet);
  float rough = mix(mix(0.72, 0.45, stone), 0.3, damp);
  rough = mix(rough, 0.03, wet);
  // the fireball as a big spherical light
  vec3 Lv = uC - gp; float d2 = dot(Lv,Lv); float d = sqrt(d2); vec3 l = Lv/d;
  float Rl = uR*0.9;
  vec3 E = uLight * (Rl*Rl)/(d2 + 0.15*Rl*Rl);
  vec3 v = -rd;
  float nl = max(dot(n,l), 0.0), nv = max(dot(n,v), 1e-3);
  vec3 hv = normalize(l+v);
  float a = clamp(rough*rough + Rl/(2.0*d)*0.35, 0.002, 1.0);   // light size widens the highlight
  float nh = max(dot(n,hv),0.0); float dd = nh*nh*(a*a-1.0)+1.0; float D = a*a/(3.14159*dd*dd);
  float F = 0.03 + 0.97*pow(1.0 - max(dot(hv,v),0.0), 5.0);
  float k = a*0.5; float G = 1.0/((nv*(1.0-k)+k) * (nl*(1.0-k)+k));
  vec3 c = alb*E*nl*0.9 + E*D*F*G*nl*0.25;
  // real reflection of the fire (sharp in puddles, faint and blurred on dry ground)
  float Fv = 0.02 + 0.98*pow(1.0-nv, 5.0);
  float refl = mix(Fv*0.4*(1.0-rough), 0.3 + 0.7*Fv, max(wet, damp*0.45));
  if(refl > 0.006 && uVis > 0.0 && dist < 40.0){
    vec3 rr = reflect(rd, n);
    vec3 jv = vec3(h12(gl_FragCoord.xy+3.1), h12(gl_FragCoord.xy+7.7), h12(gl_FragCoord.xy+1.3)) - 0.5;
    rr = normalize(rr + jv*rough*0.35);
    if(rr.y > 0.0){
      float saveD = gDetail; gDetail = 0.0;
      vec4 fr = marchFire(gp + vec3(0.0,0.01,0.0), rr, 1e9, 64.0, j);
      gDetail = saveD;
      c += fr.rgb*refl;
    }
  }
  c *= exp(-dist*0.012);                                     // air between camera and ground
  return c;
}

void main(){
  vec2 px = gl_FragCoord.xy + uJit;
  vec2 ndc = px/uRes*2.0-1.0;
  vec3 ro = uCamPos;
  vec3 rd = normalize(uCamF + ndc.x*uTanH*uAspect*uCamR + ndc.y*uTanH*uCamU);
  float tg = 1e9;
  if(uGround > 0.5 && rd.y < -1e-4) tg = (uGroundY - ro.y)/rd.y;
  float j = fract(h12(gl_FragCoord.xy*1.37 + 17.0) + uFrame*0.61803398);
  gDetail = uDetail;
  vec4 f = marchFire(ro, rd, tg, uSteps, j);
  vec3 col = f.rgb; float T = f.a;
  if(tg < 1e8 && T > 0.004) col += T * groundShade(ro, rd, tg, j);
  o = vec4(col, 1.0-T);
}`;

const SPARK_VS = `#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec4 aA;   // dir.xyz, speed
layout(location=2) in vec4 aB;   // life, size, seed, birth
uniform mat4 uVP; uniform vec3 uCn, uCam; uniform float uT,uRn,uGroundY; uniform vec2 uRes;
out vec2 vC; out vec3 vCol; out float vBig;
float Rf(float te){ return 0.25 + 1.35*(1.0-exp(-4.5*te)) + 0.4*min(te,1.8) + 0.06*max(te-1.8,0.0); }
float Cy(float te){ return -0.1 + 0.12*te; }
vec3 P(float tau){
  float tb = aB.w; vec3 d = aA.xyz; float sp = aA.w; float k = 2.2;
  vec3 p0 = vec3(0.0, Cy(tb), 0.0) + d*Rf(tb)*0.92;
  vec3 p = p0 + d*sp*(1.0-exp(-k*tau))/k;
  p.y += 0.18*tau*tau;
  p += 0.05*tau*vec3(sin(tau*4.1+aB.z*40.0), cos(tau*3.3+aB.z*23.0), sin(tau*3.7+aB.z*17.0));
  return p;
}
void main(){
  float tau = uT - aB.w; float life = aB.x;
  vC=vec2(0.0); vCol=vec3(0.0); vBig=0.0;
  if(tau<=0.0 || tau>life){ gl_Position=vec4(2.0,2.0,2.0,1.0); return; }
  float big0 = step(0.85, aB.z);
  vec3 p1=P(tau), p0=P(max(tau-mix(0.075,0.035,big0),0.0));
  if(p1.y < uGroundY){ gl_Position=vec4(2.0,2.0,2.0,1.0); return; }
  vec4 c1=uVP*vec4(p1,1.0), c0=uVP*vec4(p0,1.0);
  if(c1.w<0.05||c0.w<0.05){ gl_Position=vec4(2.0,2.0,2.0,1.0); return; }
  vec2 s1=c1.xy/c1.w*0.5*uRes, s0=c0.xy/c0.w*0.5*uRes;
  vec2 dv=s1-s0; float L=length(dv); vec2 dir = L>1e-3? dv/L : vec2(1.0,0.0);
  vec2 nr=vec2(-dir.y,dir.x);
  float big = step(0.85, aB.z), glint = step(0.96, aB.z);
  float w = max(aB.y*uRes.y/1080.0*clamp(5.0/c1.w,0.4,2.5), 0.6) * (1.0 + 1.6*big);   // embers get room for a halo
  vec2 sp = mix(s0-dir*w, s1+dir*w, aCorner.y) + nr*aCorner.x*w;
  gl_Position = vec4(sp/(0.5*uRes)*c1.w, c1.z, c1.w);
  vC = aCorner; vBig = big;
  float fade = smoothstep(0.0,0.08,tau)*(1.0-smoothstep(life*0.35,life,tau));
  float hot = exp(-tau*(2.2-1.4*big));
  vec3 c = mix(vec3(0.55,0.07,0.01), vec3(1.0,0.45,0.12), hot);
  vec3 axis = normalize(uCn - uCam); vec3 rel = p1 - uCam; float perp = length(rel - axis*dot(rel,axis));
  float sph = smoothstep(0.88, 1.06, length(p1-uCn)/uRn);
  // dust hides behind/over the fire; embers flying in front of it stay visible
  float outside = big > 0.5 ? sph : sph * smoothstep(0.75, 1.0, perp/uRn);
  float ph = aB.z*431.0;
  // tumbling embers: two beating frequencies give irregular hard flashes
  float f1 = 0.5+0.5*sin(tau*(23.0+aB.z*41.0) + ph);
  float f2 = 0.5+0.5*sin(tau*(37.0+aB.z*17.0) + ph*2.3);
  float tw = pow(f1*f2, 2.5);
  float flash = glint * pow(0.5+0.5*sin(tau*(9.0+aB.z*13.0) + ph*0.7), 18.0);
  float eDust = 0.3*(0.35+1.4*hot)*(0.55+0.9*f1);
  float eBig  = (0.5 + 2.6*hot)*(0.12 + 4.2*tw) + 14.0*flash;
  float energy = mix(eDust, eBig, big);
  vec3 cb = mix(c, vec3(1.0,0.64,0.3), clamp(tw*hot + flash, 0.0, 1.0));   // flashes run whiter
  vCol = mix(c, cb, big)*fade*outside*energy*w/(w+L*0.5);
}`;
const SPARK_FS = `#version 300 es
precision highp float; in vec2 vC; in vec3 vCol; in float vBig; out vec4 o;
void main(){
  float x2 = vC.x*vC.x;
  float core = exp(-x2*mix(3.5, 18.0, vBig));
  float halo = vBig*0.2*exp(-x2*2.2);
  float ends = smoothstep(0.0,0.2,vC.y)*smoothstep(1.0,0.8,vC.y);
  o = vec4(vCol*(core+halo)*ends, 0.0);
}`;

const BLEND_FS = `#version 300 es

const COMP_FS = `#version 300 es
precision highp float; precision highp sampler3D;
in vec2 vUv; out vec4 o;
uniform sampler2D uS, uB; uniform sampler3D uN;
uniform float uTime, uExpo, uBloom, uAspect, uGrainT; uniform vec2 uRes;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
void main(){
  vec2 uv = vUv;
  vec3 bl = texture(uB, uv).rgb;
  float heat = clamp(dot(bl, vec3(0.3,0.5,0.2))*0.6, 0.0, 1.0);
  vec2 hz = (texture(uN, vec3(uv*vec2(uAspect,1.0)*2.2, uTime*0.35)).xy*2.0-1.0);

    const t0 = ctx.currentTime, slowK = 1/Math.max(0.25, Math.sqrt(sp)), pitch = 0.55 + 0.45*Math.min(1, sp*1.2);
    // sub drop
    const o = ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(70*pitch, t0); o.frequency.exponentialRampToValueAtTime(24*pitch, t0+1.8*slowK);
    const ws = ctx.createWaveShaper(); ws.curve = curve(4);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(1.0, t0+0.012); g.gain.exponentialRampToValueAtTime(0.001, t0+3.2*slowK);
    o.connect(ws); ws.connect(g); g.connect(Sound.bus); o.start(t0); o.stop(t0+3.4*slowK);
    // body thump: noise through a closing lowpass
    const n = ctx.createBufferSource(); n.buffer = brownBuf; n.playbackRate.value = pitch;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.9; lp.frequency.setValueAtTime(2200*pitch, t0); lp.frequency.exponentialRampToValueAtTime(90, t0+1.4*slowK);
    const gn = ctx.createGain(); gn.gain.setValueAtTime(0, t0); gn.gain.linearRampToValueAtTime(1.6, t0+0.02); gn.gain.exponentialRampToValueAtTime(0.001, t0+2.6*slowK);
    n.connect(lp); lp.connect(gn); gn.connect(Sound.bus); n.start(t0, rnd()*2); n.stop(t0+2.8*slowK);
    // detonation snap
    const c = ctx.createBufferSource(); c.buffer = noiseBuf; const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 900*pitch;
    const gc = ctx.createGain(); gc.gain.setValueAtTime(0.9, t0); gc.gain.exponentialRampToValueAtTime(0.001, t0+0.09*slowK);
    c.connect(hp); hp.connect(gc); gc.connect(Sound.bus); c.start(t0, rnd()*3); c.stop(t0+0.12*slowK);
  }

  function crackle(sp, level, inside){
    const s = ctx.createBufferSource(); s.buffer = crackleBufs[Math.floor(rnd()*crackleBufs.length)];
    s.playbackRate.value = (0.7 + rnd()*0.7) * (0.4 + 0.6*Math.min(1, sp));   // slow motion = deeper, heavier pops
    const g = ctx.createGain(); g.gain.value = level*(0.25 + rnd()*rnd()*1.2);
    const p = ctx.createStereoPanner(); p.pan.value = (rnd()*2-1)*(0.35 + 0.6*inside);
    s.connect(g); g.connect(p); p.connect(Sound.bus); s.start(); s.onended = ()=>{ s.disconnect(); g.disconnect(); p.disconnect(); };
  }

  function set(param, v, tc=0.06){ param.setTargetAtTime(v, ctx.currentTime, tc); }

  return {
    get started(){ return started; }, get on(){ return on; },
    unlock(){ if(!ctx){ try{ build(); }catch(e){ console.warn(e); return; } } if(ctx.state!=='running') ctx.resume(); },
    toggle(v){ on = v; if(ctx) set(master.gain, on?0.9:0, 0.08); if(on) this.unlock(); },
    suspend(h){ if(ctx){ h ? ctx.suspend() : (on && ctx.resume()); } },
    update(st){
      if(!started || ctx.state!=='running') return;
      const {te, simDt, speed, playing, fb, cam, tti} = st;
      const sp = playing ? speed : 0;
      // listener = camera
      const L = ctx.listener, now = ctx.currentTime;
      if(L.positionX){ L.positionX.setTargetAtTime(cam.pos[0],now,0.03); L.positionY.setTargetAtTime(cam.pos[1],now,0.03); L.positionZ.setTargetAtTime(cam.pos[2],now,0.03);
        L.forwardX.setTargetAtTime(cam.f[0],now,0.03); L.forwardY.setTargetAtTime(cam.f[1],now,0.03); L.forwardZ.setTargetAtTime(cam.f[2],now,0.03);
        L.upX.setTargetAtTime(cam.u[0],now,0.03); L.upY.setTargetAtTime(cam.u[1],now,0.03); L.upZ.setTargetAtTime(cam.u[2],now,0.03);
      } else { L.setPosition(...cam.pos); L.setOrientation(...cam.f, ...cam.u); }
      const c = fb ? fb.c : [0,0.2,0], R = fb ? fb.R : 1;
      if(panner.positionX){ panner.positionX.setTargetAtTime(c[0],now,0.03); panner.positionY.setTargetAtTime(c[1],now,0.03); panner.positionZ.setTargetAtTime(c[2],now,0.03); }
      else panner.setPosition(...c);
      panner.refDistance = Math.max(1, R*1.1);
      const d = Math.hypot(cam.pos[0]-c[0], cam.pos[1]-c[1], cam.pos[2]-c[2]);
      const inside = 1 - Math.min(1, Math.max(0, (d - R*0.7)/(R*0.7)));
      set(spatial.gain, 1-inside*0.85, 0.1); set(ambient.gain, inside*0.9, 0.1);
      set(airLP.frequency, Math.max(900, 17000/(1 + Math.max(0, d-R)*0.35)), 0.1);
      // slow motion: everything drops in pitch and blooms in the hall
      const slow = 1 - Math.min(1, sp);
      set(wet.gain, 0.28 + 0.35*slow + 0.15*Math.min(1, Math.max(0,d-R)/8), 0.2);
      const pitch = 0.4 + 0.6*Math.min(1, Math.max(sp, 0.1)*1.1);
      roarSrc.playbackRate.setTargetAtTime(pitch, now, 0.2); whooshSrc.playbackRate.setTargetAtTime(pitch, now, 0.2);
      rumbleSrc.playbackRate.setTargetAtTime(0.5*pitch, now, 0.2);

      // ignition trigger (only while playing forward)
      if(playing && prevTe < 0 && te >= 0 && te < 0.3){ set(inhaleGain.gain, 0, 0.004); boom(sp); }
      prevTe = te;

      // inhale before ignition
      if(playing && tti < 1.1 && tti > 0){ const x = 1 - tti/1.1; set(inhaleGain.gain, 0.55*x*x*x, 0.03); set(inhaleHP.frequency, 180 + 2600*x*x, 0.03);
        inhaleSrc.playbackRate.setTargetAtTime(pitch, now, 0.1); }
      else if(!(playing && te>=0 && te<0.05)) set(inhaleGain.gain, 0, 0.08);

      // fire body
      const act = fb && playing ? fb.vis : (fb ? fb.vis*0.0 : 0);
      const heat = fb ? fb.heat : 0, size = fb ? Math.min(1, R/2.6) : 0;
      const growth = fb && simDt>0 ? Math.max(0, (R - prevR)/simDt) : 0; prevR = fb ? R : 0;
      set(roarGain.gain, act*(0.45 + 0.5*size)*(0.7 + 0.3*heat), 0.12);
      set(roarLP.frequency, (140 + 1300*act*Math.min(1.4,heat)*(1-0.5*(fb?fb.erode:0))) * pitch, 0.12);
      set(flutter.gain, 0.35 + 0.35*heat, 0.2);
      set(rumbleGain.gain, act*(0.35 + 0.4*size)*(1 + 0.6*slow), 0.15);
      set(whooshGain.gain, Math.min(0.8, growth*0.18)*act, 0.08); set(whooshBP.frequency, (300 + 900*Math.min(1, growth/3))*pitch, 0.08);
      set(hissGain.gain, act*(fb?fb.erode:0)*0.18, 0.2);
      // crackles: Poisson, rate follows heat and simulated time (so slow motion crackles slower and deeper)
      if(fb && playing && fb.vis > 0.02){
        const rate = (35 + 140*Math.max(0, heat-0.6)) * fb.vis * (0.6 + 0.4*size);
        crackAcc += rate * simDt;
        let n = 0; while(crackAcc > 0 && n < 12){ if(rnd() < Math.min(1, crackAcc)) crackle(sp, 0.9*fb.vis, inside); crackAcc -= 1; n++; }
        crackAcc = Math.min(crackAcc, 2);
      }
    }
  };
})();
window.addEventListener('pointerdown', ()=>{ if(Sound.on) Sound.unlock(); }, {passive:true});
window.addEventListener('keydown', ()=>{ if(Sound.on) Sound.unlock(); });
document.addEventListener('visibilitychange', ()=>Sound.suspend(document.hidden));

let frame = 0, last = performance.now(), ftAvg = 16;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fsq(){ gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES,0,3); }

function render(now){
  resize();
  const dt = Math.min(0.1, (now-last)/1000); last = now;
  const simDt = playing ? dt*speed : 0;
  clock += simDt;
  const cycleIdx = Math.floor(clock/CYCLE);
  const ct = clock - cycleIdx*CYCLE;
  const te = ct - LEAD;
  scrub.value = Math.round(ct/CYCLE*1000); scrub.style.setProperty('--p', (ct/CYCLE*100).toFixed(2)+'%');
  tc.textContent = Math.max(0,te).toFixed(1)+' s';

  // camera easing + slow cinematic drift when idle
  if(playing && !reduced && now-lastInteract > 6000) cam.tyaw += dt*0.03*Math.max(speed,0.35);
  const k = 1-Math.exp(-dt*9);
  const moving = Math.abs(cam.tyaw-cam.yaw)+Math.abs(cam.tpitch-cam.pitch)+Math.abs(cam.tdist-cam.dist) > 1e-4;
  cam.yaw+=(cam.tyaw-cam.yaw)*k; cam.pitch+=(cam.tpitch-cam.pitch)*k; cam.dist+=(cam.tdist-cam.dist)*k;
  if(moving || playing) still = 0;

  const q = QUAL[quality];
  // adaptive resolution while animating
  if(still===0 && q.adaptive){
    ftAvg = ftAvg*0.9 + (dt*1000)*0.1;
    if(frame>20 && frame%15===0){
      if(ftAvg > 24) scale = Math.max(0.3, scale-0.05);
      else if(ftAvg < 15) scale = Math.min(q.maxScale, scale+0.05);
    }
  }
  const progressive = !playing && !moving;
  // full quality: render every pixel (capped for very large screens)
  const pixCap = Math.min(1, Math.sqrt(5.2e6/(W*H)));
  const sc = progressive ? 1.0 : (q.adaptive ? scale : pixCap);
  const steps = progressive ? Math.round(q.steps*1.25) : q.steps;
  ensureScene(sc);

  const aspect = W/H, tanH = Math.tan(cam.fov*Math.PI/360) * Math.max(1, 1.45/aspect);
  const fbp = fireball(te);
  if(fbp) cam.target[1] = playing ? cam.target[1] + (fbp.c[1]+0.1 - cam.target[1])*(1-Math.exp(-dt*1.5)) : fbp.c[1]+0.1;
  if(ground){ const minP = Math.asin(Math.max(-1, Math.min(1, (GROUND_Y + 0.25 - cam.target[1])/Math.max(cam.dist,0.2)))); if(cam.tpitch < minP) cam.tpitch = minP; if(cam.pitch < minP) cam.pitch = minP; }
  const b = camBasis();
  Sound.update({te, simDt, speed, playing, fb: fbp, cam: b, tti: (ct < LEAD ? LEAD - ct : CYCLE - ct + LEAD)});
  const seedBase = ((cycleIdx*7919)%97)*1.37;

  // --- volume pass
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo); gl.viewport(0,0,scene.w,scene.h);
  gl.disable(gl.BLEND);
  const V = P.vol; gl.useProgram(V.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, noiseTex); gl.uniform1i(V.u.uN, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_3D, worleyTex); gl.uniform1i(V.u.uW, 1); gl.activeTexture(gl.TEXTURE0);
  gl.uniform3fv(V.u.uCamPos, b.pos); gl.uniform3fv(V.u.uCamF, b.f); gl.uniform3fv(V.u.uCamR, b.r); gl.uniform3fv(V.u.uCamU, b.u);
  gl.uniform1f(V.u.uTanH, tanH); gl.uniform1f(V.u.uAspect, aspect);
  const jn = progressive ? still : 0; const jit = [ (jn*0.7548776662)%1-0.5, (jn*0.56984029)%1-0.5 ];
  gl.uniform2f(V.u.uJit, jit[0], jit[1]); gl.uniform2f(V.u.uRes, scene.w, scene.h);
  const f = fbp || {R:1,c:[0,0,0],heat:0,erode:0,vis:0,soot:0};
  gl.uniform3fv(V.u.uC, f.c); gl.uniform1f(V.u.uR, f.R); gl.uniform1f(V.u.uT, Math.max(te,0)+0.4);
  gl.uniform1f(V.u.uHeat, f.heat); gl.uniform1f(V.u.uErode, f.erode); gl.uniform1f(V.u.uVis, f.vis); gl.uniform1f(V.u.uSoot, f.soot); gl.uniform1f(V.u.uCoreDark, f.coreDark||0); gl.uniform1f(V.u.uWisp, f.wisp||0);
  gl.uniform1f(V.u.uSteps, steps); gl.uniform1f(V.u.uDetail, q.detail); gl.uniform1f(V.u.uFrame, progressive ? still : 0);
  gl.uniform1f(V.u.uSigma, 2.6); const uEmitNow = 0.75 * (1 - 0.1*sm(0.7, 2.6, Math.max(te,0))); gl.uniform1f(V.u.uEmit, uEmitNow);
  gl.uniform3f(V.u.uSeed, seedBase, seedBase*0.71+3.0, seedBase*1.31+5.0);
  gl.uniform1f(V.u.uGround, ground?1:0); gl.uniform1f(V.u.uGroundY, GROUND_Y);
  const li = fbp ? f.vis * (0.55*f.heat*f.heat*f.heat + 0.08) * 90.0 * uEmitNow : 0;
  const warm = fbp ? Math.min(1, Math.max(0, (f.heat-0.7)/0.7)) : 0;
  gl.uniform3f(V.u.uLight, li*1.0, li*(0.3+0.22*warm), li*(0.06+0.08*warm));
  fsq();

  // --- sparks
  if(fbp){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    const S=P.spark; gl.useProgram(S.p);
    gl.uniformMatrix4fv(S.u.uVP, false, viewProj(b, aspect, tanH));
    gl.uniform1f(S.u.uT, te); gl.uniform3fv(S.u.uCam, b.pos); gl.uniform1f(S.u.uGroundY, ground ? GROUND_Y : -1e6); gl.uniform3fv(S.u.uCn, f.c); gl.uniform1f(S.u.uRn, f.R);
    gl.uniform2f(S.u.uRes, scene.w, scene.h);
    gl.bindVertexArray(spVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, NSP);
    gl.disable(gl.BLEND);
  }

  // --- progressive accumulation (paused + still camera = supersampled frame)
  const src = accum;
  if(!progressive || still < 96){
    // playing: every frame stands on its own (no blending between moments); paused: supersampled refinement
    const w = progressive ? 1/(still+1) : 1;
    gl.bindFramebuffer(gl.FRAMEBUFFER, accum.fbo); gl.viewport(0,0,W,H);
    gl.enable(gl.BLEND); gl.blendColor(0,0,0,w); gl.blendFunc(gl.CONSTANT_ALPHA, gl.ONE_MINUS_CONSTANT_ALPHA);
    gl.useProgram(P.blend.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex); gl.uniform1i(P.blend.u.uS,0);
    fsq(); gl.disable(gl.BLEND);
    if(progressive) still++;
  }

  // --- bloom
  gl.useProgram(P.down.p); gl.uniform1i(P.down.u.uS,0); gl.activeTexture(gl.TEXTURE0);
  let prev = src;
  for(const t of blooms){ gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo); gl.viewport(0,0,t.w,t.h);
    gl.bindTexture(gl.TEXTURE_2D, prev.tex); gl.uniform2f(P.down.u.uTx, 1/prev.w, 1/prev.h); fsq(); prev=t; }
  gl.useProgram(P.up.p); gl.uniform1i(P.up.u.uS,0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for(let i=blooms.length-1;i>0;i--){ const s=blooms[i], d=blooms[i-1];
    gl.bindFramebuffer(gl.FRAMEBUFFER,d.fbo); gl.viewport(0,0,d.w,d.h);
    gl.bindTexture(gl.TEXTURE_2D, s.tex); gl.uniform2f(P.up.u.uTx, 1/s.w, 1/s.h); gl.uniform1f(P.up.u.uW, 0.9); fsq(); }
  gl.disable(gl.BLEND);

  // --- composite
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  const C=P.comp; gl.useProgram(C.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex); gl.uniform1i(C.u.uS,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blooms[0].tex); gl.uniform1i(C.u.uB,1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_3D, noiseTex); gl.uniform1i(C.u.uN,2);
  gl.uniform1f(C.u.uTime, clock); gl.uniform1f(C.u.uExpo, 0.97); gl.uniform1f(C.u.uBloom, 0.07);
  gl.uniform1f(C.u.uAspect, aspect); gl.uniform2f(C.u.uRes, W, H);
  gl.uniform1f(C.u.uGrainT, progressive ? 0.0 : now*0.001);
  fsq();
  gl.activeTexture(gl.TEXTURE0);

  frame++;
  if(frame%20===0 || progressive) status.textContent = progressive
    ? (still<96 ? `Refining image ${Math.round(still/96*100)}%` : 'Final image')
    : `${Math.round(1000/ftAvg)} fps, ${Math.round(sc*100)}% resolution, ${steps} steps`;
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
